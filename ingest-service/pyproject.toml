[project]
name = "ingest-service"
version = "0.1.0"
description = "The Ingest Service for the Action-Executing AI Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "amqp>=5.3.1",
    "azure-storage-blob>=12.25.1",
    "celery[redis]>=5.5.3",
    "fastembed>=0.7.1",
    "httpx>=0.28.1",
    "kombu>=5.5.4",
    "langchain>=0.3.26",
    "langchain-community>=0.3.27",
    "langchain-openai>=0.3.27",
    "langchain-qdrant>=0.2.0",
    "langchain-text-splitters>=0.3.8",
    "markdown>=3.8.2",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pymupdf>=1.26.3",
    "pypdf>=5.7.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "structlog>=25.4.0",
    # "unstructured[all-docs]>=0.10.0",
]

[dependency-groups]
lint = [
    "ruff>=0.9.7",
]
