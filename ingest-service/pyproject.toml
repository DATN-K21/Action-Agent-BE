[project]
name = "ingest-service"
version = "0.1.0"
description = "Document ingestion and processing service that consumes messages from ai-service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.5.3",
    "kombu>=5.3.0", # For RabbitMQ support
    "amqp>=5.2.0", # AMQP protocol support for RabbitMQ
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",  # Required for langchain_postgres
    "pgvector>=0.3.0",
    "azure-storage-blob>=12.25.1",
    "langchain>=0.3.19",
    "langchain-text-splitters>=0.3.2",
    "langchain-community>=0.3.13",
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.13.3",
    "markdown>=3.5.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "langchain-postgres>=0.0.15",
    "langchain-openai>=0.3.27",
    "structlog>=25.4.0",
    "unstructured[all-docs]>=0.10.0",
    "pymupdf>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
