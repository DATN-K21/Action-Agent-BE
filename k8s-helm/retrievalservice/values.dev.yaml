# Default values for retrievalservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: myaagent.azurecr.io/retrievalservicedev
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

nameOverride: "retrievalservicedev"
fullnameOverride: "retrievalservicedev"

env:
  - name: LOGGING_LOG_LEVEL
    value: "DEBUG"

  - name: GRPC_PORT
    value: "15600"

  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: openaiapikey
  - name: OPENAI_EMBED_MODEL
    value: "text-embedding-3-small"
  - name: OPENAI_LLM_MODEL
    value: "gpt-4o-mini"

  - name: QDRANT_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: qdranturl
  - name: QDRANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: qdrantapikey
  - name: QDRANT_COLLECTION
    value: "documents"