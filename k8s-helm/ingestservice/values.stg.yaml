# Default values for ingestservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: myaagent.azurecr.io/ingestservicestg
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

nameOverride: "ingestservicestg"
fullnameOverride: "ingestservicestg"

env:
  - name: DEBUG_MODE
    value: "True"
  - name: LOGGING_LOG_LEVEL
    value: "DEBUG"
  
  - name: QDRANT_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: qdranturl
  - name: QDRANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: qdrantapikey
  - name: QDRANT_COLLECTION
    value: "documents"

  - name: OPENAI_EMBED_MODEL
    value: "text-embedding-3-small"
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: openaiapikey

  - name: MAX_UPLOAD_SIZE
    value: "52428800"  # 50 MB
  - name: AZURE_BLOB_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: azureblobconnectionstring
  - name: AZURE_BLOB_CONTAINER_NAME
    value: "uploadingstg"

  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: rabbitmqurl
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: redisurl

  - name: AI_SERVICE_URL
    value: "http://aiservicestg:15200"