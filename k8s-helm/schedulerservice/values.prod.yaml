# Default values for schedulerservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: myaagent.azurecr.io/schedulerserviceprod
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

nameOverride: "schedulerserviceprod"
fullnameOverride: "schedulerserviceprod"

env:
# ===================== HOST AND PORT =====================
  - name: HOST
    value: "0.0.0.0"
  - name: PORT
    value: "15800"

# ===================== DEBUG MODES =====================
  - name: DEBUG_SERVER
    value: "false"
  - name: LOG_LEVEL
    value: "INFO"

# ===================== DATABASE CONNECTION =====================
  - name: POSTGRES_URL_PATH
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: postgresurlpath
  - name: POSTGRES_SCHEMA
    value: "schedulerservice"
  - name: DEBUG_SQLALCHEMY
    value: "false"

# ===================== URL SETTINGS =====================
  - name: AI_SERVICE_URL
    value: "http://aiserviceprod:15200"
  - name: API_V1_PREFIX
    value: "/api/v1"

# ===================== SCHEDULER SETTINGS =====================
  - name: SCHEDULER_TIMEZONE
    value: "UTC"
  - name: MAX_CONCURRENT_JOBS
    value: "10"
  - name: JOB_TIMEOUT
    value: "300"
  - name: MAX_RETRIES
    value: "3"