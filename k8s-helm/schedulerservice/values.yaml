# Default values for schedulerservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
revisionHistoryLimit: 0

image:
  repository: myaagent.azurecr.io/schedulerservice
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

imagePullSecrets:
  - name: regcred
nameOverride: "schedulerservice"
fullnameOverride: "schedulerservice"

env:
  # Placeholder

service:
  type: ClusterIP
  port: 15800
  targetport: 15800

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "15800"
  prometheus.io/path: "/metrics"

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  requests:
    cpu: "10m"
    memory: "100Mi"
  limits:
    cpu: "300m"
    memory: "500Mi"

nodeSelector:
  beta.kubernetes.io/arch: amd64

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

tolerations: []

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux
