# Default values for paymentservice.
image:
  repository: myaagent.azurecr.io/paymentservicestg
  pullPolicy: Always
  tag: BuildID

nameOverride: "paymentservicestg"
fullnameOverride: "paymentservicestg"

env:
  - name: Logging__LogLevel__Default
    value: "Information"
  - name: Logging__LogLevel__Microsoft.AspNetCore
    value: "Warning"

  - name: AllowedHosts
    value: "*"

  - name: ASPNETCORE_HTTP_PORTS
    value: "15700"

  - name: MongoSettings__ConnectionString
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: mongodbconnectionstring
  - name: MongoSettings__DatabaseName
    value: "test"
  - name: MongoSettings__UserCollectionName
    value: "Users"
  - name: MongoSettings__PaymentCollectionName
    value: "Payments"

  - name: StripeSettings__SecretKey
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: stripesecretkey
  - name: StripeSettings__WebhookSecret
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: stripewebhooksecret

  - name: RateSettings__CreditsPerUsd
    value: "1000000"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    spec.ingressClassName: "nginx"
    nginx.org/websocket-services: "paymentservicestg"
    nginx.ingress.kubernetes.io/client-max-body-size: "30m"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: pay-stg.action-agent.software
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: paymentservicestg
              port:
                number: 15700
  tls:
    - secretName: pay-stg-tls
      hosts:
        - pay-stg.action-agent.software