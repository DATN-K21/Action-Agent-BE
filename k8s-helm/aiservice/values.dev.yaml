# Default values for aiservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: myaagent.azurecr.io/aiservicedev
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

nameOverride: "aiservicedev"
fullnameOverride: "aiservicedev"

env:
  # ===================== DEBUG MODES =====================
  - name: DEBUG_AGENT
    value: "False"
  - name: DEBUG_SERVER
    value: "False"
  - name: DEBUG_SQLALCHEMY
    value: "False"

  # ===================== LOGGING =====================
  - name: LOGGING_LOG_LEVEL
    value: "INFO"

  # ===================== USER AGENT =====================
  - name: USER_AGENT
    value: "Action-LLM-AI-Service/1.0 (Educational Project)"

  # ===================== LLM PROVIDERS =====================
  - name: OPENAI_PROVIDER
    value: "openai"
  - name: ANTHROPIC_PROVIDER
    value: "anthropic"

  # ===================== LLM MODELS =====================
  - name: LLM_BASIC_MODEL
    value: "gpt-4o-mini"
  - name: BASIC_MODEL_TEMPERATURE
    value: "0.5"
  - name: BASIC_MODEL_CONTEXT_RATIO
    value: "0.2"

  - name: LLM_REASONING_MODEL
    value: "claude-3-5-haiku-20241022"
  - name: REASONING_MODEL_TEMPERATURE
    value: "0"
  - name: REASONING_MODEL_CONTEXT_RATIO
    value: "0.1"

  - name: LLM_VISION_MODEL
    value: "gpt-4o-mini"
  - name: VISION_MODEL_TEMPERATURE
    value: "0.5"
  - name: VISION_MODEL_CONTEXT_RATIO
    value: "0.2"

  - name: LLM_SUGGESTION_MODEL
    value: "gpt-4.1-mini"
  - name: SUGGESTION_MODEL_TEMPERATURE
    value: "0.3"
  - name: SUGGESTION_MODEL_MAX_TOKENS
    value: "500"

  # ===================== OPENAI API =====================
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: openaiapikey
  - name: OPENAI_API_BASE_URL
    value: "https://api.openai.com/v1"

  # ===================== ANTHROPIC API =====================
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: anthropicapikey
  - name: ANTHROPIC_API_BASE_URL
    value: "https://api.anthropic.com"

  # ===================== DEFAULT CONTEXT SETTINGS =====================
  - name: DEFAULT_CONTEXT_LIMIT
    value: "100000"
  - name: DEFAULT_CONTEXT_RATIO
    value: "0.2"

  # ===================== DATABASE =====================
  - name: POSTGRES_URL_PATH
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: postgresurlpath
  - name: POSTGRES_SCHEMA
    value: "aiservice"

  # ===================== TOOLS =====================
  - name: TOOL_TAVILY_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: taviliapikey

  # ===================== COMPOSIO =====================
  - name: COMPOSIO_LOGGING_LEVEL
    value: "debug"
  - name: COMPOSIO_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: composioapikey
  - name: COMPOSIO_REDIRECT_URL
    value: "https://api-dev.action-agent.software/ai/api/v1/callback/extension"

  # ===================== SECURITY KEYS =====================
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: secretkey
  - name: MODEL_PROVIDER_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: modelproviderencryptionkey

  # ===================== GRAPH SETTINGS =====================
  - name: RECURSION_LIMIT
    value: "25"

  # ===================== CACHE SETTINGS =====================
  - name: MAX_PERSONAL_TOOLS_PER_USER
    value: "500"
  - name: MAX_CACHED_USERS
    value: "200"
  - name: MAX_CACHED_EXTENSION_SERVICES
    value: "400"
  - name: MAX_CACHED_MCP_USERS
    value: "100"
  - name: MAX_MCP_CLIENT_INSTANCES_PER_USER
    value: "20"

  # ===================== UPLOAD SETTINGS =====================
  - name: MAX_UPLOAD_SIZE_MB
    value: "52428800"
  - name: AZURE_BLOB_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: azureblobconnectionstring
  - name: AZURE_BLOB_CONTAINER_NAME
    value: "uploadingdev"

  # ===================== CELERY SETTINGS =====================
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: rabbitmqurl
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: redisurl

  # ===================== URLS =====================
  - name: RETRIEVAL_SERVICE_GRPC_URL
    value: "retrievalservicedev:15600"
  - name: EXTENSION_SERVICE_URL
    value: "http://extensionservicedev:15300"
  - name: FRONTEND_REDIRECT_URL
    value: "https://dev.action-agent.software/callback/extension"