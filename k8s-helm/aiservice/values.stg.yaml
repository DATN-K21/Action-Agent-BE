# Default values for aiservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: myaagent.azurecr.io/aiservicestg
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: BuildID

nameOverride: "aiservicestg"
fullnameOverride: "aiservicestg"

env:
  # ===================== DEBUG MODES =====================
  - name: DEBUG_AGENT
    value: "False"
  - name: DEBUG_SERVER
    value: "False"
  - name: DEBUG_SQLALCHEMY
    value: "False"

  # ===================== LOGGING =====================
  - name: LOGGING_LOG_LEVEL
    value: "INFO"

  # ===================== USER AGENT =====================
  - name: USER_AGENT
    value: "Action-LLM-AI-Service/1.0 (Educational Project)"

  # ===================== LLM PROVIDERS =====================
  - name: OPENAI_PROVIDER
    value: "openai"
  - name: REASONING_MODEL_PROVIDER
    value: "deepseek"
  - name: VISION_MODEL_PROVIDER
    value: "openai"
  - name: SUGGESTION_MODEL_PROVIDER
    value: "openai"

  # ===================== LLM MODELS =====================
  # Basic LLM model
  - name: BASIC_MODEL
    value: "gpt-4o-mini"
  - name: BASIC_MODEL_TEMPERATURE
    value: "0.5"
  - name: BASIC_MODEL_CONTEXT_RATIO
    value: "0.2"
  - name: BASIC_MODEL_API_BASE_URL
    value: "https://api.openai.com/v1"
  - name: BASIC_MODEL_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: basicmodelapikey

  # Reasoning LLM model
  - name: REASONING_MODEL
    value: "deepseek-chat"
  - name: REASONING_MODEL_TEMPERATURE
    value: "0"
  - name: REASONING_MODEL_CONTEXT_RATIO
    value: "0.2"
  - name: REASONING_MODEL_API_BASE_URL
    value: "https://api.deepseek.com"
  - name: REASONING_MODEL_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: reasoningmodelapikey

  # Vision LLM model
  - name: VISION_MODEL
    value: "gpt-4o-mini"
  - name: VISION_MODEL_TEMPERATURE
    value: "0.5"
  - name: VISION_MODEL_CONTEXT_RATIO
    value: "0.2"
  - name: VISION_MODEL_API_BASE_URL
    value: "https://api.openai.com/v1"
  - name: VISION_MODEL_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: visionmodelapikey

  # Suggestion LLM model
  - name: SUGGESTION_MODEL
    value: "gpt-4o-mini"
  - name: SUGGESTION_MODEL_TEMPERATURE
    value: "0.3"
  - name: SUGGESTION_MODEL_MAX_TOKENS
    value: "5000"
  - name: SUGGESTION_MODEL_API_BASE_URL
    value: "https://api.openai.com/v1"
  - name: SUGGESTION_MODEL_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: suggestionmodelapikey

  # ===================== OPENAI API =====================
  - name: OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: openaiapikey
  - name: OPENAI_API_BASE_URL
    value: "https://api.openai.com/v1"

  # ===================== ANTHROPIC API =====================
  - name: ANTHROPIC_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: anthropicapikey
  - name: ANTHROPIC_API_BASE_URL
    value: "https://api.anthropic.com"

  # ===================== DEEPSEEK API =====================
  - name: DEEPSEEK_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: deepseekapikey
  - name: DEEPSEEK_API_BASE_URL
    value: "https://api.deepseek.com"

  - name: ANTHROPIC_API_BASE_URL
    value: "https://api.anthropic.com"

  # ===================== DEFAULT CONTEXT SETTINGS =====================
  - name: DEFAULT_CONTEXT_LIMIT
    value: "100000"
  - name: DEFAULT_CONTEXT_RATIO
    value: "0.2"

  # ===================== DATABASE =====================
  - name: POSTGRES_URL_PATH
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: postgresurlpath
  - name: POSTGRES_SCHEMA
    value: "aiservice"

  # ===================== TOOLS =====================
  - name: TOOL_TAVILY_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: taviliapikey

  # ===================== COMPOSIO =====================
  - name: COMPOSIO_LOGGING_LEVEL
    value: "debug"
  - name: COMPOSIO_API_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: composioapikey
  - name: COMPOSIO_REDIRECT_URL
    value: "https://api-stg.action-agent.software/ai/api/v1/callback/extension"

  # ===================== SECURITY KEYS =====================
  - name: SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: secretkey
  - name: MODEL_PROVIDER_ENCRYPTION_KEY
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: modelproviderencryptionkey

  # ===================== GRAPH SETTINGS =====================
  - name: RECURSION_LIMIT
    value: "25"

  # ===================== CACHE SETTINGS =====================
  - name: MAX_PERSONAL_TOOLS_PER_USER
    value: "500"
  - name: MAX_CACHED_USERS
    value: "200"
  - name: MAX_CACHED_EXTENSION_SERVICES
    value: "400"
  - name: MAX_CACHED_MCP_USERS
    value: "100"
  - name: MAX_MCP_CLIENT_INSTANCES_PER_USER
    value: "20"

  # ===================== UPLOAD SETTINGS =====================
  - name: MAX_UPLOAD_SIZE_MB
    value: "52428800"
  - name: AZURE_BLOB_CONNECTION_STRING
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: azureblobconnectionstring
  - name: AZURE_BLOB_CONTAINER_NAME
    value: "uploadingstg"

  # ===================== CELERY SETTINGS =====================
  - name: RABBITMQ_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: rabbitmqurl
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: env-secret
        key: redisurl

  # ===================== URLS =====================
  - name: RETRIEVAL_SERVICE_GRPC_URL
    value: "retrievalservicestg:15600"
  - name: EXTENSION_SERVICE_URL
    value: "http://extensionservicestg:15300"
  - name: SCHEDULER_SERVICE_URL
    value: "http://schedulerservicestg:15800"
  - name: FRONTEND_REDIRECT_URL
    value: "http://localhost:3000/callback/extension"

  # ===================== CACHE SETTINGS =====================
  # Memory and Cache settings
  - name: SYSTEM_MEMORY_THRESHOLD
    value: "92.0"
  - name: CACHE_MEMORY_THRESHOLD
    value: "0.92"
  - name: CACHE_STARTUP_GRACE_PERIOD
    value: "60.0"
  - name: CACHE_CLEANUP_RATIO
    value: "0.2"
  - name: CACHE_ENABLE_MEMORY_LOGGING
    value: "True"
  - name: CACHE_DETAILED_LOGGING_INTERVAL
    value: "300.0"
  - name: CACHE_MEMORY_CHECK_INTERVAL
    value: "120.0"
  - name: CACHE_TTL_SECONDS
    value: "3600.0"

  # Cache for streaming connections
  - name: STREAMING_CONNECTIONS_CACHE_MAX_ENTRIES
    value: "1000"
  - name: STREAMING_CONNECTIONS_CACHE_MAX_MEMORY_MB
    value: "64.0"

  # Cache for tools
  - name: TOOLS_CACHE_MAX_ENTRIES
    value: "1000"
  - name: TOOLS_CACHE_MAX_MEMORY_MB
    value: "512.0"

  # Cache for extension services
  - name: EXTENSION_SERVICES_CACHE_MAX_ENTRIES
    value: "400"
  - name: EXTENSION_SERVICES_CACHE_MAX_MEMORY_MB
    value: "256.0"

  # Number of processors
  - name: MAX_WORKERS
    value: "1"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    spec.ingressClassName: "nginx"
    nginx.org/websocket-services: "aiservicestg"
    nginx.ingress.kubernetes.io/client-max-body-size: "30m"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ai-stg.action-agent.software
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: aiservicestg
              port:
                number: 15200
  tls:
    - secretName: ai-stg-tls
      hosts:
        - ai-stg.action-agent.software