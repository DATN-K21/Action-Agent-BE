<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #e6e6e6;
            border-radius: 6px;
        }

        h1 {
            font-size: 20px;
            text-align: center;
        }

        h2 {
            text-align: center;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
        }

        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Password Reset Request</h1>
        <p>Dear User,</p>
        <p>You have requested to reset your password. Use the following OTP code:</p>
        <h2>{{otpCode}}</h2>
        <p>This code will expire in 5 minutes.</p>
        <p>If you did not request this, you may ignore this email.</p>
        <p>Best regards,<br>HCMUS Action‑AI Agent Team</p>
        <div class="footer">Please do not reply to this email.</div>
    </div>
</body>

</html>
