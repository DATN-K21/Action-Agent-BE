target-version = "py311"
line-length = 120
fix = true

# Exclude generated protobuf files
exclude = [
    "generated/*_pb2.py",
    "generated/*_pb2_grpc.py",
]

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings  
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "F401", # imported but unused (for grpc imports)
    "F403", # star imports (protobuf files may use these)
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
