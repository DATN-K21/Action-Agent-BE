    "amqp>=5.3.1",
    "anthropic>=0.54.0",
    "asyncpg>=0.30.0",
    "azure-storage-blob>=12.25.1",
    "beautifulsoup4>=4.13.3",
    "celery[redis]>=5.5.3",
    "composio>=0.1.1",
    "composio-langchain>=0.7.4",
    "composio-langgraph>=0.7.4",
    "crewai>=0.120.1",
    "dateparser>=1.2.1",
    "docker>=7.1.0",
    "duckduckgo-search>=8.0.2",
    "fastapi[standard]>=0.115.8",
    "google-auth-oauthlib>=1.2.1",
    "grpcio>=1.66.0",
    "httpx>=0.27.0",
    "inquirerpy>=0.3.4",
    "kombu>=5.5.4",
    "langchain>=0.3.19",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-mcp-adapters>=0.1.3",
    "langchain-openai>=0.3.6",
    "langgraph>=0.2.74",
    "langgraph-checkpoint-postgres>=2.0.15",
    "markdownify>=1.1.0",
    "numexpr>=2.10.2",
    "passlib>=1.7.4",
    "pillow>=11.1.0",
    "psycopg-binary>=3.2.5",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "pytz>=2025.1",
    "readabilipy>=0.3.0",
    "sqlalchemy>=2.0.38",
    "sse-starlette>=2.2.1",
    "structlog>=25.1.0",
    "wikipedia>=1.4.0",
    "zhipuai>=2.1.5.20250526",
